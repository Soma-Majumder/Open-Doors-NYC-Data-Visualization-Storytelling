name: Refresh Open Doors data

# Re-pulls every number from the live NYC Open Data endpoint on a schedule
# and commits the result if anything changed. The dataset itself only
# updates annually, so weekly is generous — this just means the site
# never goes more than a week out of sync with the source of truth,
# without ever hitting the API from a visitor's browser.

on:
  schedule:
    - cron: "0 13 * * 1" # every Monday, 13:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest data from NYC Open Data
        run: node scripts/fetch-data.mjs
        env:
          # Optional: add NYC_OPEN_DATA_APP_TOKEN as a repo secret to move
          # off the shared anonymous rate limit. Not required to run.
          NYC_OPEN_DATA_APP_TOKEN: ${{ secrets.NYC_OPEN_DATA_APP_TOKEN }}

      - name: Commit updated data file, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/open-doors-data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh Open Doors data from NYC Open Data"
            git push
          fi
